# CI gate: every push to main and every pull request.
#
# The workflow always runs, so required status checks never wait on a run that
# was skipped. The first job works out whether anything besides documentation
# changed; the code and migration jobs are skipped for docs-only changes, which
# GitHub treats as passing. The secret scan always runs, because documentation
# can leak credentials too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      # Pinned to the v4.0.3 commit so a moved tag can't change what runs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          # 'every': a file counts only if it matches all rules, i.e. it is
          # anything other than Markdown or the licence.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only, so it is pinned exactly.
      - uses: astral-sh/setup-uv@v10.2.0

      # --locked fails if uv.lock is out of date with pyproject.toml; --all-groups
      # includes the experiments group so experiment scripts are type-checked too.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint, format check and type check
        run: make lint

      - name: Tests
        run: make test

  # Applies every migration and the seed to a throwaway Postgres, runs the schema
  # checks, then the Python tests that need a database.
  migrations:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgres 17 with pgvector, matching the production database.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations and run schema checks
        run: bash supabase/ci/apply_migrations.sh

      # Python tests marked `db` run against the database the migrations just built.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Database tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest -m db --no-cov

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so a secret committed and later deleted is still found.
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified release)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLO "${base}/${file}"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${file}" gitleaks

      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --verbose .
