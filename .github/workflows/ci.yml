# CI gate: every push and pull request must pass lint, format check, type check and tests.
name: CI

# Skipped when a push/PR only changes documentation or the license — those can't
# break lint, types or tests. Any change touching another file runs the full checks.
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs uv, which then installs the Python version pinned in .python-version.
      # setup-uv publishes exact version tags only (no floating "v10"), so it's pinned exactly.
      - uses: astral-sh/setup-uv@v10.2.0

      # --locked fails the build if uv.lock is out of date with pyproject.toml.
      # --all-groups also installs the experiments group, so experiment scripts
      # are type-checked in CI too (they never ship with the application).
      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  # Applies every database migration, in order, to a throwaway Postgres and runs
  # the schema checks — so a broken migration fails here instead of in the real
  # Supabase database (where migrations are applied by hand).
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgres 17 with the pgvector extension (needed by the memory tables).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until the database accepts connections before running steps.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations and run schema checks
        run: bash supabase/ci/apply_migrations.sh
