# --- Turn detection --------------------------------------------------------------
[presets.livekit_v1_mini]
kind = "turn_detector"
vendor = "livekit"
model = "v1-mini"

# Uses the STT's own end-of-turn signal; only valid with an STT that reports one.
[presets.stt_native]
kind = "turn_detector"
vendor = "stt"

# --- Speculative trigger (when to start drafting early) ---------------------------
# "auto" resolves per STT at session start; see catalog.resolve_trigger.
[presets.auto]
kind = "speculative_trigger"
vendor = "companion"

[presets.livekit_preemptive]
kind = "speculative_trigger"
vendor = "livekit"

[presets.transcript_rules]
kind = "speculative_trigger"
vendor = "companion"

[presets.transcript_debounce_only]
kind = "speculative_trigger"
vendor = "companion"

[presets.vad_silence]
kind = "speculative_trigger"
vendor = "companion"
