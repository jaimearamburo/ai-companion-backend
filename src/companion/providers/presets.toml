# Every provider preset the registry knows. Vendor details (endpoints, model IDs,
# which credential to use) live only here. A preset is chosen per call in the
# dispatch metadata, or by default from a region profile (regions.toml).
#
# Candidates, not commitments: each layer's vendor is chosen by comparing cost and
# measured latency when that layer is built (PLAN.md D22).

# --- Speech to text ------------------------------------------------------------
[presets.deepgram_nova3_au]
kind = "stt"
vendor = "deepgram"
model = "nova-3"
endpoint = "https://api.au.deepgram.com"
credential = "deepgram"
emits_preflight = true

[presets.deepgram_flux_au]
kind = "stt"
vendor = "deepgram"
model = "flux-general-en"
endpoint = "https://api.au.deepgram.com"
credential = "deepgram"
emits_preflight = true
reports_end_of_turn = true

[presets.deepgram_nova3_global]
kind = "stt"
vendor = "deepgram"
model = "nova-3"
endpoint = "https://api.deepgram.com"
credential = "deepgram"
emits_preflight = true

[presets.inworld_stt1]
kind = "stt"
vendor = "inworld"
model = "inworld-stt-1"
credential = "inworld"
reports_end_of_turn = true

# --- Text to speech ------------------------------------------------------------
[presets.fish_s21_hosted]
kind = "tts"
vendor = "fish"
model = "s2.1-pro"
endpoint = "https://api.fish.audio"
credential = "fish"

[presets.deepgram_aura2_au]
kind = "tts"
vendor = "deepgram"
model = "aura-2"
endpoint = "https://api.au.deepgram.com"
credential = "deepgram"

